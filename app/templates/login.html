{% extends "base.html" %}
{% block title %}Login | Estacionamiento Romina{% endblock %}
{% block content %}
<main class="auth-layout">
  <section class="auth-stage auth-stage-compact">
    <article class="card auth-card">
      <img class="auth-logo" src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo Romina">
      <p class="eyebrow">Acceso</p>
      <h2>Iniciar sesion</h2>
      <form method="post" class="form-grid">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>
          Usuario
          <input type="text" name="username" required maxlength="50" autocomplete="username">
        </label>
        <label>
          Contrasena
          <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button class="btn" type="submit">Entrar</button>
      </form>
    </article>
  </section>
</main>
{% endblock %}
