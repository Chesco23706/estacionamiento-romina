{% extends "base.html" %}
{% block title %}Editar Registro{% endblock %}
{% block content %}
<main class="single-column">
  <section class="card">
    <h2>Editar registro #{{ record.id }}</h2>
    <form method="post" class="form-grid">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>
        Ficha
        <input type="text" name="ticket_number" required value="{{ record.display_ticket_number }}">
      </label>
      <label>
        Cliente
        <input type="text" name="client_name" required value="{{ record.client_name }}">
      </label>
      <label>
        Tipo de vehiculo
        <select name="vehicle_type" required>
          {% for vehicle_type in vehicle_types %}
          <option value="{{ vehicle_type }}" {% if record.vehicle_type == vehicle_type %}selected{% endif %}>{{ vehicle_type }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        Modalidad
        <select name="stay_mode" required data-record-mode>
          {% for mode, label in record_stay_modes %}
          <option value="{{ mode }}" {% if record.stay_mode == mode %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </label>
      <input type="hidden" name="contracted_days" value="{{ record.contracted_days or 7 }}" data-contracted-days-input>
      <label>
        Placas
        <input type="text" name="plate_number" required value="{{ record.plate_number }}">
      </label>
        <section class="service-panel full-width" data-service-panel>
          <div class="service-panel-header">
            <span>Servicios</span>
            <button class="btn btn-secondary service-toggle-btn" type="button" data-service-panel-toggle>
              {% if record.service_wash or record.service_oil_change or record.service_oil_price %}Editar servicios{% else %}Agregar servicios{% endif %}
            </button>
          </div>
          <div class="service-panel-body" data-service-panel-body {% if not (record.service_wash or record.service_oil_change or record.service_oil_price) %}hidden{% endif %}>
            <label class="checkbox-row">
              <input type="checkbox" name="service_wash" {% if record.service_wash %}checked{% endif %} data-service-wash>
              Lavado de moto $20
            </label>
            <label class="checkbox-row">
              <input type="checkbox" name="service_oil_change" {% if record.service_oil_change %}checked{% endif %} data-service-oil-change>
              Cambio de aceite $40
            </label>
            <label data-oil-price-field {% if not record.service_oil_change %}hidden{% endif %}>
              Precio del aceite
              <input type="number" name="service_oil_price" min="0.01" step="0.01" inputmode="decimal" value="{{ record.service_oil_price or '' }}">
            </label>
          </div>
        </section>
      <label>
        Estado
        <select name="status" required>
          {% for status in status_options %}
          <option value="{{ status }}" {% if record.status == status %}selected{% endif %}>{{ status }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="full-width">
        Notas
        <textarea name="notes" rows="3">{{ record.notes or '' }}</textarea>
      </label>
      <div class="button-row">
        <button class="btn" type="submit">Guardar cambios</button>
        <a class="link-button" href="{{ url_for('main.records_page') }}">Volver</a>
      </div>
    </form>
  </section>
</main>
{% endblock %}
