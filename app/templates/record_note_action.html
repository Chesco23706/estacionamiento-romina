{% set note_text = (record.notes or '')|trim %}
{% if note_text %}
<button class="note-action-btn note-action-has-note" type="button" data-open-dialog="record-note-dialog-{{ record.id }}" title="Ver nota" aria-label="Ver nota de la ficha {{ record.display_ticket_number }}">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M6 4.5h8.5L18 8v11.5H6z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.9"/>
    <path d="M14.5 4.5V8H18M9 12h6M9 15.5h4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"/>
  </svg>
  <span class="sr-only">Ver nota</span>
</button>
{% else %}
<button class="note-action-btn note-action-empty" type="button" data-open-dialog="record-dialog-{{ record.id }}" title="Agregar nota" aria-label="Agregar nota a la ficha {{ record.display_ticket_number }}">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.2"/>
  </svg>
  <span class="sr-only">Agregar nota</span>
</button>
{% endif %}
