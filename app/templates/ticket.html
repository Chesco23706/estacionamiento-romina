{% extends "base.html" %}
{% block title %}Ticket {{ record.display_ticket_number }}{% endblock %}
{% block content %}
<main class="single-column">
  <section class="card ticket-card">
    <div class="ticket-header">
      <div>
        <p class="eyebrow">Documento generado</p>
        <h2>Ficha {{ record.display_ticket_number }}</h2>
        <p class="muted">Ya puedes verlo, descargarlo o imprimirlo.</p>
      </div>
      <img class="ticket-logo" src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo Romina">
    </div>

    <div class="button-row no-print">
      <a class="btn" href="{{ url_for('main.ticket_document', record_id=record.id) }}" target="_blank" rel="noopener">Abrir PDF</a>
      <a class="btn btn-secondary" href="{{ url_for('main.ticket_document', record_id=record.id, download=1) }}">Descargar PDF</a>
      <a class="link-button" href="{{ url_for('main.dashboard') }}">Volver al panel</a>
    </div>

    <iframe
      class="ticket-frame"
      src="{{ url_for('main.ticket_document', record_id=record.id) }}"
      title="Vista previa del ticket">
    </iframe>
  </section>
</main>
{% endblock %}
